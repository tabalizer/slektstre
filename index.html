<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Slektstre">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <title>Slektstre</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <button type="button" class="nav-btn" id="btn-back" aria-label="Tilbake">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span>Tilbake</span>
      </button>
      <button type="button" class="nav-btn" id="btn-home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5L12 5l8 6.5M6.5 10v9h11v-9"/></svg>
        <span>Hjem</span>
      </button>
      <div class="topbar-spacer"></div>
      <button type="button" class="nav-btn" id="btn-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <span>Søk</span>
      </button>
      <button type="button" class="nav-btn nav-btn-quiet" id="btn-settings">
        <span class="lbl-long">Innstillinger</span><span class="lbl-short">Mer</span>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" hidden>

  <script src="js/tegnsett.js"></script>
  <script src="js/gedcom.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
